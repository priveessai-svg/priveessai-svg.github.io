<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SMERAV</title>

<style>
body{margin:0;font-family:Arial;background:#f4f6f9}

/* HERO VIDEO */
.hero{
height:90vh;
position:relative;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
color:white;
}

video{
position:absolute;
width:100%;
height:100%;
object-fit:cover;
top:0;
left:0;
}

.overlay{
position:absolute;
width:100%;
height:100%;
background:rgba(0,0,0,0.6);
top:0;
left:0;
}

.content{
position:relative;
z-index:1;
}

h1{font-size:40px;margin:0}
p{font-size:18px}

.btn{
display:inline-block;
margin-top:15px;
padding:10px 20px;
background:#ff7a00;
color:white;
text-decoration:none;
border-radius:5px;
}

/* SECTION */
.section{
padding:50px 20px;
text-align:center;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
max-width:1000px;
margin:auto;
}

.card{
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

/* PROJECTS */
.project img{
width:100%;
border-radius:10px;
}

/* WHATSAPP */
.whatsapp{
position:fixed;
bottom:20px;
right:20px;
background:#25D366;
color:white;
padding:15px;
border-radius:50px;
text-decoration:none;
}

footer{
background:#004080;
color:white;
padding:20px;
text-align:center;
}
</style>

</head>

<body>

<!-- HERO -->
<div class="hero">

<video autoplay muted loop playsinline>

</video>

<div class="overlay"></div>

<p>Travaux • Eau potable • Assainissement</p>
<a class="btn" href="https://wa.me/212661808894">Demander un devis</a>
</div>

</div>

<!-- SERVICES -->
<section class="section">
<h2>Nos Services</h2>

<div class="grid">
<div class="card">Réseaux d’eau potable</div>
<div class="card">Assainissement</div>
<div class="card">Génie civil</div>
</div>
</section>

<!-- PROJECTS -->
<section class="section">
<h2>Nos Réalisations</h2>

<div class="grid">

<div class="project">
<img src="réseaux-d'eaux-potable.jpg">
</div>

<div class="project">
<img src="réseaux-d'assainissement.jpg">
</div>

<div class="project">
<img src="genie-civil.jpg">
</div>

</div>
</section>

<!-- CONTACT -->
<section class="section">
<h2>Contact</h2>
<p>📍 Fès, Maroc</p>
<p>📞 +212 661 80 88 94</p>
</section>

<a class="whatsapp" href="https://wa.me/212661808894">💬</a>

<footer>
© 2026 SMERAV
</footer>

</body>
</html>
