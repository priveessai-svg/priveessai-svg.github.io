<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SMERAV</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}

/* ===== WAVES BACKGROUND ===== */
.wave-bg{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
z-index:-1;
overflow:hidden;
background:linear-gradient(to bottom,#0f4c81,#1e88e5);
}

.wave{
position:absolute;
width:200%;
height:200px;
background:rgba(255,255,255,0.2);
border-radius:40%;
opacity:0.6;
}

.wave:nth-child(1){top:20%;animation:wave1 10s linear infinite;}
.wave:nth-child(2){top:40%;animation:wave2 14s linear infinite;opacity:0.4;}
.wave:nth-child(3){top:60%;animation:wave3 18s linear infinite;opacity:0.3;}

@keyframes wave1{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
@keyframes wave2{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
@keyframes wave3{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}

/* ===== الكود ديالك كما هو ===== */

body{background:transparent}

.nav{
position:fixed;
top:0;
width:100%;
display:flex;
justify-content:space-between;
align-items:center;
padding:12px 20px;
background:rgba(0,0,0,0.5);
backdrop-filter:blur(10px);
z-index:999;
}

.logo{height:50px}

.menu-btn{
font-size:28px;
color:white;
background:rgba(0,0,0,0.5);
padding:8px 12px;
border-radius:8px;
cursor:pointer;
}

.overlay{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.5);
opacity:0;
visibility:hidden;
transition:0.3s;
z-index:998;
}
.overlay.active{opacity:1;visibility:visible}

.menu{
position:fixed;
top:0;
right:-280px;
width:260px;
height:100%;
background:black;
display:flex;
flex-direction:column;
padding:30px 20px;
transition:0.4s;
z-index:999;
}
.menu.active{right:0}

.close-btn{
color:white;
font-size:26px;
align-self:flex-end;
cursor:pointer;
margin-bottom:20px;
}

.menu a{
color:white;
font-size:20px;
margin:10px 0;
text-decoration:none;
}

.dropdown-title{
color:white;
font-size:20px;
display:flex;
justify-content:space-between;
cursor:pointer;
margin:10px 0;
}

.dropdown-content{
max-height:0;
overflow:hidden;
transition:0.4s;
}

.dropdown-content a{
display:block;
color:#ccc;
margin:5px 0;
}

.dropdown.active .dropdown-content{max-height:300px}
.dropdown.active .arrow{transform:rotate(180deg)}

.hero{
height:100vh;
background:url("local.png?v=6") center/cover no-repeat;
display:flex;
justify-content:center;
align-items:center;
color:white;
text-align:center;
position:relative;
}

.hero::before{
content:"";
position:absolute;
width:100%;
height:100%;
background:rgba(0,0,0,0.5);
}

.hero-text{
position:relative;
z-index:2;
background:rgba(0,0,0,0.5);
padding:20px;
border-radius:10px;
}

.section{
padding:70px 20px;
text-align:center;
}

.service{
background:white;
margin:10px auto;
padding:15px;
border-radius:12px;
width:90%;
max-width:400px;
cursor:pointer;
}

.gallery{
display:none;
grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
gap:10px;
margin-top:10px;
}
.gallery.active{display:grid}

.gallery img{
width:100%;
height:180px;
object-fit:cover;
border-radius:10px;
}

.offre img{
width:90%;
max-width:800px;
border-radius:10px;
}

.projects img{
width:90%;
margin:10px;
border-radius:10px;
}

input,textarea{
width:90%;
margin:10px;
padding:12px;
border:none;
background:#eee;
border-radius:10px;
}

button{
background:gold;
padding:12px 20px;
border:none;
border-radius:10px;
}

.map-box{
position:relative;
height:350px;
border-radius:20px;
overflow:hidden;
margin-top:20px;
}

.map-box iframe{
width:100%;
height:100%;
border:0;
}

.whatsapp{
position:fixed;
bottom:20px;
right:20px;
background:#25D366;
color:white;
padding:15px;
border-radius:50%;
text-decoration:none;
}

#successMsg{
display:none;
background:green;
color:white;
padding:10px;
margin-top:10px;
border-radius:8px;
}
</style>
</head>

<body>

<!-- WAVES -->
<div class="wave-bg">
<div class="wave"></div>
<div class="wave"></div>
<div class="wave"></div>
</div>

<!-- NAVBAR -->
<div class="nav">
<img src="logo-transparent.png?v=6" class="logo">
<div class="menu-btn" onclick="toggleMenu()">☰</div>
</div>

<div class="overlay" id="overlay" onclick="closeMenu()"></div>

<!-- MENU -->
<div class="menu" id="menu">

<div class="close-btn" onclick="closeMenu()">✕</div>

<div class="dropdown">
<div class="dropdown-title" onclick="toggleDropdown(this)">
Services <span class="arrow">⌄</span>
</div>
<div class="dropdown-content">
<a href="#services" onclick="closeMenu()">Réseaux d'eau potable</a>
<a href="#services" onclick="closeMenu()">Assainissement</a>
<a href="#services" onclick="closeMenu()">Génie civil</a>
<a href="#services" onclick="closeMenu()">Forage et équipement</a>
<a href="#services" onclick="closeMenu()">Vente pièces réseaux</a>
</div>
</div>

<a href="#offre" onclick="closeMenu()">Offre</a>
<a href="#projects" onclick="closeMenu()">Projets</a>
<a href="#contact" onclick="closeMenu()">Contact</a>

</div>

<!-- HERO -->
<section class="hero">
<div class="hero-text">
<h1>SMERAV</h1>
<p>Notre expertise, votre réussite</p>
</div>
</section>

<!-- باقي الكود ديالك كامل (ما تبدل حتى حاجة) -->

<!-- ABOUT -->
<section class="section">
<h2>About</h2>
<p>SMERAV : Société de travaux publics basée à Fès...</p>
</section>

<!-- SERVICES -->
<section class="section" id="services">
<h2>Nos Services</h2>

<div class="service" onclick="show('eau')">Réseaux d'eau potable</div>
<div id="eau" class="gallery">
<img src="reseaux-eaux-potable.jpg?v=6">
<img src="branchement-eaux.jpg?v=6">
</div>

</section>

<!-- WHATSAPP -->
<a class="whatsapp" href="#">💬</a>

<script>
function toggleMenu(){
document.getElementById("menu").classList.toggle("active");
document.getElementById("overlay").classList.toggle("active");
}
function closeMenu(){
document.getElementById("menu").classList.remove("active");
document.getElementById("overlay").classList.remove("active");
}
function toggleDropdown(el){
el.parentElement.classList.toggle("active");
}
function show(id){
document.getElementById(id).classList.toggle("active");
}
</script>

</body>
</html>
