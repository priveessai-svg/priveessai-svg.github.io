<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SMERAV</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}

/* ===== LOADER ===== */
#loader{
position:fixed;
top:0;left:0;
width:100%;height:100%;
background:#000814;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
z-index:9999;
color:white;
transition:0.8s;
}
#loader.hide{opacity:0;visibility:hidden}

.spinner{
width:50px;height:50px;
border:4px solid rgba(255,255,255,0.2);
border-top:4px solid white;
border-radius:50%;
animation:spin 1s linear infinite;
margin-bottom:15px;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* ===== HERO NEW DESIGN ===== */
.hero{
height:100vh;
background:url("local.png?v=6") center/cover no-repeat;
position:relative;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
color:white;
}

.hero::before{
content:"";
position:absolute;
top:0;left:0;
width:100%;height:100%;
background:rgba(0,0,0,0.45);
}

.hero-text{
position:relative;
z-index:2;
max-width:90%;
}

.hero-text h1{
font-size:40px;
font-weight:600;
margin-bottom:10px;
}

.hero-text p{
font-size:16px;
opacity:0.9;
margin-bottom:20px;
}

.hero-btn{
display:inline-block;
padding:12px 25px;
border:1px solid white;
color:white;
text-decoration:none;
border-radius:25px;
transition:0.3s;
}

.hero-btn:hover{
background:white;
color:black;
}

/* ===== ORIGINAL ===== */
body{background:#f5f5f5}

.nav{
position:fixed;
top:0;width:100%;
display:flex;
justify-content:space-between;
align-items:center;
padding:12px 20px;
background:rgba(0,0,0,0.5);
z-index:999;
}

.logo{height:50px}

.menu-btn{
font-size:28px;color:white;
background:rgba(0,0,0,0.5);
padding:8px 12px;border-radius:8px;
cursor:pointer;
}

.overlay{
position:fixed;top:0;left:0;width:100%;height:100%;
background:rgba(0,0,0,0.5);
opacity:0;visibility:hidden;
transition:0.3s;
}
.overlay.active{opacity:1;visibility:visible}

.menu{
position:fixed;
top:0;right:-280px;
width:260px;height:100%;
background:black;
display:flex;flex-direction:column;
padding:30px 20px;
transition:0.4s;
}
.menu.active{right:0}

.menu a{
color:white;
margin:10px 0;
text-decoration:none;
}

/* باقي الكود ديالك */
.section{padding:70px 20px;text-align:center}

.service{background:white;margin:10px auto;padding:15px;border-radius:12px;width:90%;max-width:400px}

.gallery{display:none}
.gallery.active{display:grid}

input,textarea{width:90%;margin:10px;padding:12px;background:#eee;border:none;border-radius:10px}

button{background:gold;padding:12px;border:none;border-radius:10px}

.map-box{height:350px}
.map-box iframe{width:100%;height:100%}

.whatsapp{
position:fixed;bottom:20px;right:20px;
background:#25D366;color:white;
padding:15px;border-radius:50%;
}
</style>
</head>

<body>

<!-- LOADER -->
<div id="loader">
<div class="spinner"></div>
<h2>SMERAV</h2>
</div>

<!-- NAVBAR -->
<div class="nav">
<img src="logo-transparent.png?v=6" class="logo">
<div class="menu-btn" onclick="toggleMenu()">☰</div>
</div>

<div class="overlay" id="overlay" onclick="closeMenu()"></div>

<div class="menu" id="menu">
<a href="#services">Services</a>
<a href="#offre">Offre</a>
<a href="#projects">Projets</a>
<a href="#contact">Contact</a>
</div>

<!-- HERO -->
<section class="hero">
<div class="hero-text">
<h1>SMERAV</h1>
<p>Solutions complètes pour l’eau et l’assainissement</p>
<a href="#contact" class="hero-btn">Demander un devis</a>
</div>
</section>

<!-- باقي الكود ديالك كما هو -->

<script>
window.addEventListener("load",()=>{
document.getElementById("loader").classList.add("hide");
});

function toggleMenu(){
menu.classList.toggle("active");
overlay.classList.toggle("active");
}

function closeMenu(){
menu.classList.remove("active");
overlay.classList.remove("active");
}
</script>

</body>
</html>
