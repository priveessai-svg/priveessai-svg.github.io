<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SMERAV</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#f5f5f5}

/* NAVBAR */
.nav{
position:fixed;
top:0;
width:100%;
display:flex;
justify-content:space-between;
align-items:center;
padding:12px 20px;
background:rgba(0,0,0,0.5);
backdrop-filter:blur(10px);
z-index:999;
}

.logo{height:50px}

/* MENU BUTTON */
.menu-btn{
font-size:28px;
color:white;
background:rgba(0,0,0,0.5);
padding:8px 12px;
border-radius:8px;
cursor:pointer;
}

/* MENU */
.menu{
position:fixed;
top:0;
right:-100%;
width:100%;
height:100%;
background:black;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
transition:0.5s;
}

.menu a{
color:white;
font-size:28px;
margin:20px;
text-decoration:none;
}

.menu.active{right:0}

/* HERO */
.hero{
height:100vh;
position:relative;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
color:white;
text-align:center;
}

.slide{
position:absolute;
width:100%;
height:100%;
object-fit:cover;
opacity:0;
transition:1s;
}

.slide.active{opacity:1}

.hero-text{
position:relative;
z-index:2;
background:rgba(0,0,0,0.5);
padding:20px;
border-radius:10px;
}

/* SECTION */
.section{
padding:70px 20px;
text-align:center;
}

/* SERVICES */
.service{
background:white;
margin:10px auto;
padding:15px;
border-radius:12px;
width:90%;
max-width:400px;
cursor:pointer;
}
.service:hover{background:#eee}

/* GALLERY */
.gallery{
display:none;
grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
gap:10px;
margin-top:10px;
}
.gallery.active{display:grid}

.gallery img{
width:100%;
height:180px;
object-fit:cover;
border-radius:10px;
}

/* OFFRE */
.offre img{
width:90%;
max-width:800px;
border-radius:10px;
}

/* PROJECT */
.projects img{
width:90%;
margin:10px;
border-radius:10px;
}

/* CONTACT */
input,textarea{
width:90%;
margin:10px;
padding:12px;
border:none;
background:#eee;
border-radius:10px;
}

button{
background:gold;
padding:12px 20px;
border:none;
border-radius:10px;
}

/* WHATSAPP */
.whatsapp{
position:fixed;
bottom:20px;
right:20px;
background:#25D366;
color:white;
padding:15px;
border-radius:50%;
text-decoration:none;
}

/* MAP */
.map-box{
position:relative;
height:350px;
border-radius:20px;
overflow:hidden;
margin-top:20px;
}

.map-box iframe{
width:100%;
height:100%;
border:0;
}

.map-info{
position:absolute;
bottom:15px;
left:15px;
background:white;
padding:15px;
border-radius:12px;
}

/* ANIMATION */
.fade{
opacity:0;
transform:translateY(20px);
transition:0.6s;
}
.fade.show{
opacity:1;
transform:translateY(0);
}
</style>
</head>

<body>

<!-- NAVBAR -->
<div class="nav">
<img src="logo-transparent.png?v=5" class="logo">
<div class="menu-btn" onclick="toggleMenu()">☰</div>
</div>

<!-- MENU -->
<div class="menu" id="menu">
<a href="#home" onclick="closeMenu()">Accueil</a>
<a href="#services" onclick="closeMenu()">Services</a>
<a href="#offre" onclick="closeMenu()">Offre</a>
<a href="#projects" onclick="closeMenu()">Projets</a>
<a href="#contact" onclick="closeMenu()">Contact</a>
</div>

<!-- HERO -->
<section class="hero" id="home">
<img src="local.png?v=5" class="slide active">
<img src="projet1.jpg?v=5" class="slide">
<img src="projet3.jpg?v=5" class="slide">

<div class="hero-text">
<h1>SMERAV</h1>
<p>Notre expertise, votre réussite</p>
</div>
</section>

<!-- ABOUT -->
<section class="section fade">
<h2>About</h2>
<p>SMERAV entreprise basée à Fès spécialisée en travaux publics.</p>
</section>

<!-- SERVICES -->
<section class="section" id="services">
<h2>Nos Services</h2>

<div class="service" onclick="show('eau')">Réseaux d'eau potable</div>
<div id="eau" class="gallery">
<img src="reseaux-eaux-potable.jpg?v=5">
<img src="branchement-eaux.jpg?v=5">
<img src="raccordement-eau.jpg?v=5">
</div>

<div class="service" onclick="show('assainissement')">Assainissement</div>
<div id="assainissement" class="gallery">
<img src="reseaux-assainissement1.jpg?v=5">
<img src="branchement-assainesement.jpg?v=5">
</div>

</section>

<!-- MAP -->
<section class="section">
<h2>Localisation</h2>
<div class="map-box">
<iframe src="https://www.google.com/maps?q=Fes,Morocco&output=embed"></iframe>
<div class="map-info">
<p>📍 Fès</p>
</div>
</div>
</section>

<!-- WHATSAPP -->
<a class="whatsapp" href="https://wa.me/212661808894">💬</a>

<script>
document.addEventListener("DOMContentLoaded", function(){

const menu = document.getElementById("menu");

window.toggleMenu = function(){
menu.classList.toggle("active");
}

window.closeMenu = function(){
menu.classList.remove("active");
}

window.show = function(id){
document.getElementById(id).classList.toggle("active");
}

/* SLIDER */
let slides=document.querySelectorAll(".slide");
let i=0;
setInterval(()=>{
slides[i].classList.remove("active");
i=(i+1)%slides.length;
slides[i].classList.add("active");
},4000);

/* SCROLL */
const elements=document.querySelectorAll('.fade');
window.addEventListener('scroll',()=>{
elements.forEach(el=>{
if(el.getBoundingClientRect().top < window.innerHeight-50){
el.classList.add('show');
}
});
});

});
</script>

</body>
</html>
