<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SMERAV</title>

<!-- SEO -->
<meta name="description" content="SMERAV travaux publics Fès Maroc réseaux eau potable assainissement">
<meta name="keywords" content="SMERAV, travaux publics Maroc, eau potable, assainissement">
<meta name="robots" content="index, follow">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#f5f5f5}

/* NAV */
.nav{
position:fixed;
top:0;width:100%;
display:flex;justify-content:space-between;align-items:center;
padding:12px 20px;
background:rgba(0,0,0,0.5);
z-index:999;
}
.logo{height:50px}
.menu-btn{
font-size:28px;color:white;cursor:pointer;
}

/* MENU */
.menu{
position:fixed;
top:0;right:-280px;
width:260px;height:100%;
background:black;
padding:20px;
transition:0.4s;
z-index:1000;
}
.menu.active{right:0}

.menu a{color:white;display:block;margin:10px 0;text-decoration:none}

.dropdown-content{display:none}
.dropdown.active .dropdown-content{display:block}

/* OVERLAY */
.overlay{
position:fixed;
width:100%;height:100%;
background:rgba(0,0,0,0.5);
opacity:0;visibility:hidden;
}
.overlay.active{opacity:1;visibility:visible}

/* HERO */
.hero{
height:100vh;
background:url("local.png") center/cover no-repeat;
display:flex;align-items:center;justify-content:center;
color:white;text-align:center;
}
.hero-text{
background:rgba(0,0,0,0.5);
padding:20px;border-radius:10px;
}

/* SECTION */
.section{padding:70px 20px;text-align:center}

/* SERVICES */
.service{
background:white;
margin:10px auto;
padding:15px;
border-radius:12px;
width:90%;max-width:400px;
cursor:pointer;
}
.gallery{display:none;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.gallery.active{display:grid}
.gallery img{width:100%;height:180px;object-fit:cover;border-radius:10px}

/* CONTACT */
input,textarea{
width:90%;margin:10px;padding:10px;border:none;background:#eee;border-radius:8px
}
button{background:gold;padding:10px 20px;border:none;border-radius:8px}

/* MAP */
.map-box{height:350px;border-radius:20px;overflow:hidden}
.map-box iframe{width:100%;height:100%}

/* WHATSAPP */
.whatsapp{
position:fixed;bottom:20px;right:20px;
background:#25D366;color:white;padding:15px;border-radius:50%;
}
</style>
</head>

<body>

<!-- NAV -->
<div class="nav">
<img src="logo-transparent.png" class="logo">
<div class="menu-btn" onclick="toggleMenu()">☰</div>
</div>

<div class="overlay" id="overlay" onclick="closeMenu()"></div>

<!-- MENU -->
<div class="menu" id="menu">
<div onclick="closeMenu()" style="color:white;font-size:20px">✕</div>

<div onclick="toggleDropdown(this)">Services</div>
<div class="dropdown-content">
<a href="#services">Réseaux eau potable</a>
<a href="#services">Assainissement</a>
<a href="#services">Génie civil</a>
</div>

<a href="#offre">Offre</a>
<a href="#projects">Projets</a>
<a href="#contact">Contact</a>
</div>

<!-- HERO -->
<section class="hero">
<div class="hero-text">
<h1>SMERAV</h1>
<p>Notre expertise, votre réussite</p>
</div>
</section>

<!-- SERVICES -->
<section class="section" id="services">
<h2>Nos Services</h2>

<div class="service" onclick="show('eau')">Réseaux d'eau potable</div>
<div id="eau" class="gallery">
<img src="reseaux-eaux-potable.jpg">
<img src="branchement-eaux.jpg">
<img src="raccordement-eau.jpg">
</div>

<div class="service" onclick="show('assainissement')">Assainissement</div>
<div id="assainissement" class="gallery">
<img src="reseaux-assainissement1.jpg">
</div>

</section>

<!-- CONTACT -->
<section class="section" id="contact">
<h2>Contact</h2>

<form action="https://formsubmit.co/sarl.smerav@gmail.com" method="POST">
<input type="text" name="name" placeholder="Nom" required>
<input type="email" name="email" placeholder="Email" required>
<textarea name="message" placeholder="Message" required></textarea>
<button type="submit">Envoyer</button>

<input type="hidden" name="_captcha" value="false">
</form>

<p>📍 Fès Maroc</p>
<p>📞 +212661808894</p>
</section>

<!-- MAP -->
<section class="section">
<h2>Localisation</h2>
<div class="map-box">
<iframe src="https://www.google.com/maps?q=Fes,Morocco&output=embed"></iframe>
</div>
</section>

<a href="#" class="whatsapp">💬</a>

<script>
function toggleMenu(){
menu.classList.toggle("active");
overlay.classList.toggle("active");
}
function closeMenu(){
menu.classList.remove("active");
overlay.classList.remove("active");
}
function toggleDropdown(el){
el.nextElementSibling.classList.toggle("active");
}
function show(id){
document.getElementById(id).classList.toggle("active");
}
</script>

</body>
</html>
