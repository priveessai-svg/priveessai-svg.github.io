<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SMERAV</title>

<style>

/* RESET */
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial;}
body{background:#f5f5f5;scroll-behavior:smooth;}

/* HERO */
.hero{
height:100vh;
background:url("local.png") center/cover no-repeat;
display:flex;
align-items:center;
justify-content:center;
color:white;
text-align:center;
position:relative;
}

.hero::after{
content:"";
position:absolute;
width:100%;
height:100%;
background:rgba(0,0,0,0.5);
}

.hero-content{position:relative;z-index:2;}
.hero h1{font-size:40px;}
.hero p{margin-top:10px;}

/* LOGO */
.logo{
position:absolute;
top:20px;
left:20px;
z-index:5;
}

.logo img{
width:60px;
}

/* MENU BUTTON */
.menu-btn{
position:absolute;
top:20px;
right:20px;
font-size:30px;
color:white;
cursor:pointer;
z-index:5;
}

/* MENU PRO */
.menu{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.95);
backdrop-filter:blur(10px);
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
transform:translateY(-100%);
transition:0.6s;
z-index:9999;
}

.menu.active{
transform:translateY(0);
}

.menu a{
font-size:32px;
color:white;
text-decoration:none;
margin:20px 0;
transition:0.3s;
}

.menu a:hover{
color:#ff7a00;
}

/* SERVICES */
.services{
padding:40px 20px;
text-align:center;
}

.service{
background:white;
margin:15px;
padding:20px;
border-radius:10px;
cursor:pointer;
box-shadow:0 5px 10px rgba(0,0,0,0.1);
}

/* MODAL */
.modal{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.95);
display:none;
flex-direction:column;
align-items:center;
justify-content:center;
color:white;
z-index:2000;
}

.slider{
width:90%;
max-width:400px;
}

.slider img{
width:100%;
border-radius:10px;
}

.slide-title{
margin-top:10px;
font-size:18px;
}

button{
padding:10px;
margin:5px;
border:none;
background:#ff7a00;
color:white;
border-radius:5px;
cursor:pointer;
}

.close{
position:absolute;
top:20px;
right:20px;
font-size:30px;
cursor:pointer;
}

/* WHATSAPP */
.whatsapp{
position:fixed;
bottom:20px;
right:20px;
background:#25D366;
width:60px;
height:60px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:28px;
color:white;
text-decoration:none;
animation:pulse 1.5s infinite;
z-index:3000;
}

@keyframes pulse{
0%{transform:scale(1);}
50%{transform:scale(1.1);}
100%{transform:scale(1);}
}

.whatsapp-box{
position:fixed;
bottom:90px;
right:20px;
background:white;
padding:15px;
border-radius:10px;
display:none;
}

</style>
</head>

<body>

<!-- HERO -->
<div class="hero" id="top">

<div class="logo">
<a href="#"><img src="logo.png"></a>
</div>

<div class="menu-btn" onclick="openMenu()">☰</div>

<div class="hero-content">
<h1>SMERAV</h1>
<p>Notre expertise, votre réussite</p>
</div>

</div>

<!-- MENU -->
<div class="menu" id="menu">

<div onclick="openMenu()" style="position:absolute;top:20px;right:20px;font-size:35px;cursor:pointer;">✕</div>

<img src="logo.png" style="width:80px;margin-bottom:40px;">

<a onclick="goSection('top')">Accueil</a>
<a onclick="goSection('services')">Services</a>
<a onclick="goSection('contact')">Contact</a>

</div>

<!-- SERVICES -->
<div class="services" id="services">
<h2>Nos Services</h2>

<div class="service" onclick="openService('eau')">Réseaux d'eau potable</div>
<div class="service" onclick="openService('assainissement')">Assainissement</div>
<div class="service" onclick="openService('genie')">Génie civil</div>

</div>

<!-- CONTACT -->
<div class="services" id="contact">
<h2>Contact</h2>
<p>Fès, Maroc</p>
<p>+212 661 80 88 94</p>
</div>

<!-- MODAL -->
<div class="modal" id="modal">
<div class="close" onclick="closeModal()">✖</div>

<h2 id="modal-title"></h2>
<p id="modal-text"></p>

<div class="slider">
<img id="slide-img">
<div class="slide-title" id="slide-title"></div>
</div>

<button onclick="prev()">⬅</button>
<button onclick="next()">➡</button>

</div>

<!-- WHATSAPP -->
<div class="whatsapp-box" id="wbox">
<p>Besoin d’un devis ?</p>
<button onclick="goWhatsApp()">Contact</button>
</div>

<a class="whatsapp" onclick="goWhatsApp()">💬</a>

<script>

/* MENU */
function openMenu(){
document.getElementById("menu").classList.toggle("active");
}

function goSection(id){
openMenu();
document.getElementById(id).scrollIntoView({behavior:"smooth"});
}

/* SLIDER */
let images=[],titles=[],current=0,autoSlide;

function openService(type){

current=0;

if(type==="eau"){
images=["réseaux-d'eaux-potable.jpg","detection-des-fuites.jpg"];
titles=["Réseaux eau","Détection fuites"];
document.getElementById("modal-title").innerText="Réseaux d'eau potable";
document.getElementById("modal-text").innerText="Installation + maintenance.";
}

if(type==="assainissement"){
images=["réseaux-d'assainissement.jpg"];
titles=["Assainissement"];
document.getElementById("modal-title").innerText="Assainissement";
}

if(type==="genie"){
images=["genie-civil.jpg"];
titles=["Génie civil"];
document.getElementById("modal-title").innerText="Génie civil";
}

document.getElementById("modal").style.display="flex";
showSlide();

clearInterval(autoSlide);
autoSlide=setInterval(next,3000);
}

function showSlide(){
document.getElementById("slide-img").src=images[current];
document.getElementById("slide-title").innerText=titles[current];
}

function next(){current=(current+1)%images.length;showSlide();}
function prev(){current=(current-1+images.length)%images.length;showSlide();}

function closeModal(){
document.getElementById("modal").style.display="none";
clearInterval(autoSlide);
}

/* WHATSAPP */
function goWhatsApp(){
window.open("https://wa.me/212661808894?text=Bonjour%20SMERAV%2C%20je%20veux%20un%20devis");
}

/* POPUP */
setTimeout(()=>{
document.getElementById("wbox").style.display="block";
},3000);

</script>

</body>
</html>
