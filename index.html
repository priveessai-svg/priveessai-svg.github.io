<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SMERAV</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#f5f5f5}

/* NAV */
.nav{
position:fixed;
top:0;
width:100%;
display:flex;
justify-content:space-between;
align-items:center;
padding:12px 20px;
background:rgba(0,0,0,0.5);
backdrop-filter:blur(10px);
z-index:1000;
}

.logo{height:50px}

.menu-btn{
font-size:28px;
color:white;
cursor:pointer;
}

/* OVERLAY */
.overlay{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.5);
opacity:0;
visibility:hidden;
transition:0.3s;
z-index:900;
}
.overlay.active{
opacity:1;
visibility:visible;
}

/* SIDE MENU */
.menu{
position:fixed;
top:0;
right:-280px;
width:260px;
height:100%;
background:black;
padding:30px 20px;
transition:0.4s;
z-index:1000;
display:flex;
flex-direction:column;
}

.menu.active{right:0}

.close-btn{
color:white;
font-size:26px;
align-self:flex-end;
cursor:pointer;
margin-bottom:20px;
}

/* LINKS */
.menu a{
color:white;
font-size:20px;
margin:10px 0;
text-decoration:none;
}

/* DROPDOWN */
.dropdown-title{
color:white;
font-size:20px;
display:flex;
justify-content:space-between;
cursor:pointer;
margin:10px 0;
}

.dropdown-content{
max-height:0;
overflow:hidden;
transition:0.4s;
}

.dropdown-content a{
display:block;
color:#ccc;
font-size:17px;
margin:5px 0;
}

.dropdown.active .dropdown-content{
max-height:300px;
}

.dropdown.active .arrow{
transform:rotate(180deg);
}

/* HERO */
.hero{
height:100vh;
position:relative;
overflow:hidden;
display:flex;
align-items:center;
justify-content:center;
color:white;
}

.slide{
position:absolute;
width:100%;
height:100%;
object-fit:cover;
opacity:0;
transition:1s;
}

.slide.active{opacity:1}

.hero-text{
background:rgba(0,0,0,0.5);
padding:20px;
border-radius:10px;
z-index:2;
}

/* SECTION */
.section{padding:70px 20px;text-align:center}

/* SERVICES */
.service{
background:white;
margin:10px auto;
padding:15px;
border-radius:12px;
width:90%;
max-width:400px;
cursor:pointer;
}
.gallery{
display:none;
grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
gap:10px;
}
.gallery.active{display:grid}

.gallery img{
width:100%;
height:180px;
object-fit:cover;
border-radius:10px;
}

/* MAP */
.map-box{
height:350px;
border-radius:20px;
overflow:hidden;
}

/* WHATSAPP */
.whatsapp{
position:fixed;
bottom:20px;
right:20px;
background:#25D366;
color:white;
padding:15px;
border-radius:50%;
}
</style>
</head>

<body>

<!-- NAV -->
<div class="nav">
<img src="logo-transparent.png" class="logo">
<div class="menu-btn" onclick="toggleMenu()">☰</div>
</div>

<div class="overlay" id="overlay" onclick="closeMenu()"></div>

<!-- MENU -->
<div class="menu" id="menu">

<div class="close-btn" onclick="closeMenu()">✕</div>

<div class="dropdown">
<div class="dropdown-title" onclick="toggleDropdown(this)">
Services <span class="arrow">⌄</span>
</div>
<div class="dropdown-content">
<a href="#services">Réseaux eau potable</a>
<a href="#services">Assainissement</a>
<a href="#services">Génie civil</a>
<a href="#services">Forage</a>
</div>
</div>

<a href="#projects" onclick="closeMenu()">Projects</a>

<div class="dropdown">
<div class="dropdown-title" onclick="toggleDropdown(this)">
About <span class="arrow">⌄</span>
</div>
<div class="dropdown-content">
<a href="#home">Entreprise</a>
<a href="#contact">Contact</a>
</div>
</div>

<a href="#contact" onclick="closeMenu()">Contact</a>

</div>

<!-- HERO -->
<section class="hero" id="home">
<img src="local.png" class="slide active">
<img src="projet1.jpg" class="slide">
<img src="projet3.jpg" class="slide">

<div class="hero-text">
<h1>SMERAV</h1>
<p>Votre expertise, notre réussite</p>
</div>
</section>

<!-- SERVICES -->
<section class="section" id="services">
<h2>Nos Services</h2>

<div class="service" onclick="show('eau')">Réseaux d'eau potable</div>
<div id="eau" class="gallery">
<img src="reseaux-eaux-potable.jpg">
<img src="raccordement-eau.jpg">
</div>

</section>

<!-- PROJECT -->
<section class="section" id="projects">
<h2>Nos Projets</h2>
<img src="projet1.jpg" style="width:90%">
</section>

<!-- MAP -->
<section class="section">
<h2>Localisation</h2>
<div class="map-box">
<iframe src="https://www.google.com/maps?q=Fes,Morocco&output=embed" width="100%" height="100%"></iframe>
</div>
</section>

<!-- CONTACT -->
<section class="section" id="contact">
<h2>Contact</h2>
<input placeholder="Nom">
<input placeholder="Email">
<textarea placeholder="Message"></textarea>
<button>Envoyer</button>
</section>

<a href="#" class="whatsapp">💬</a>

<script>
document.addEventListener("DOMContentLoaded", function(){

const menu=document.getElementById("menu");
const overlay=document.getElementById("overlay");

window.toggleMenu=function(){
menu.classList.toggle("active");
overlay.classList.toggle("active");
}

window.closeMenu=function(){
menu.classList.remove("active");
overlay.classList.remove("active");
}

window.toggleDropdown=function(el){
el.parentElement.classList.toggle("active");
}

window.show=function(id){
document.getElementById(id).classList.toggle("active");
}

/* SLIDER */
let slides=document.querySelectorAll(".slide");
let i=0;
setInterval(()=>{
slides[i].classList.remove("active");
i=(i+1)%slides.length;
slides[i].classList.add("active");
},4000);

});
</script>

</body>
</html>
