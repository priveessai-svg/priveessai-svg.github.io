<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SMERAV</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:#f5f5f5;
}

/* HERO */
.hero{
height:100vh;
background:url("local.png") center/cover no-repeat;
display:flex;
align-items:center;
justify-content:center;
color:white;
text-align:center;
position:relative;
}

.hero::after{
content:"";
position:absolute;
width:100%;
height:100%;
background:rgba(0,0,0,0.5);
top:0;
left:0;
}

.hero-content{
position:relative;
z-index:2;
}

.hero h1{font-size:40px;}
.hero p{margin-top:10px;font-size:18px;}

/* LOGO */
.logo{
position:absolute;
top:20px;
left:20px;
z-index:3;
}

.logo img{
width:60px;
}

/* MENU */
.menu-btn{
position:absolute;
top:20px;
right:20px;
font-size:30px;
color:white;
cursor:pointer;
z-index:3;
}

.menu{
position:fixed;
top:0;
right:-100%;
width:100%;
height:100%;
background:black;
color:white;
transition:0.5s;
padding:50px;
z-index:999;
overflow-y:auto;
}

.menu.active{
right:0;
}

.menu a{
display:block;
margin:20px 0;
font-size:24px;
color:white;
text-decoration:none;
}

/* SERVICES */
.services{
padding:40px 20px;
text-align:center;
}

.service{
background:white;
margin:15px;
padding:20px;
border-radius:10px;
cursor:pointer;
box-shadow:0 5px 10px rgba(0,0,0,0.1);
}

/* MODAL */
.modal{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.9);
display:none;
flex-direction:column;
align-items:center;
justify-content:center;
color:white;
z-index:2000;
}

.slider{
width:90%;
max-width:400px;
position:relative;
}

.slider img{
width:100%;
border-radius:10px;
}

.slide-title{
margin-top:10px;
font-size:18px;
}

.controls{
margin-top:10px;
}

button{
padding:10px;
margin:5px;
border:none;
background:#ff7a00;
color:white;
cursor:pointer;
border-radius:5px;
}

.close{
position:absolute;
top:20px;
right:20px;
font-size:30px;
cursor:pointer;
}

/* WHATSAPP */
.whatsapp{
position:fixed;
bottom:20px;
right:20px;
background:#25D366;
color:white;
padding:15px;
border-radius:50%;
font-size:20px;
text-decoration:none;
z-index:3000;
box-shadow:0 4px 10px rgba(0,0,0,0.3);
}

</style>
</head>

<body>

<!-- HERO -->
<div class="hero">

<div class="logo">
<a href="#"><img src="logo.png"></a>
</div>

<div class="menu-btn" onclick="openMenu()">☰</div>

<div class="hero-content">
<h1>SMERAV</h1>
<p>Notre expertise, votre réussite</p>
</div>

</div>

<!-- MENU -->
<div class="menu" id="menu">
<a href="#">Accueil</a>
<a href="#services">Services</a>
<a href="#contact">Contact</a>
</div>

<!-- SERVICES -->
<div class="services" id="services">
<h2>Nos Services</h2>

<div class="service" onclick="openService('eau')">
Réseaux d'eau potable
</div>

<div class="service" onclick="openService('assainissement')">
Assainissement
</div>

<div class="service" onclick="openService('genie')">
Génie civil
</div>

</div>

<!-- CONTACT -->
<div class="services" id="contact">
<h2>Contact</h2>
<p>Fès, Maroc</p>
<p>+212 661 80 88 94</p>
</div>

<!-- MODAL -->
<div class="modal" id="modal">

<div class="close" onclick="closeModal()">✖</div>

<h2 id="modal-title"></h2>
<p id="modal-text"></p>

<div class="slider">
<img id="slide-img">
<div class="slide-title" id="slide-title"></div>
</div>

<div class="controls">
<button onclick="prev()">⬅</button>
<button onclick="next()">➡</button>
</div>

</div>

<!-- WHATSAPP BUTTON -->
<a class="whatsapp" href="https://wa.me/212661808894" target="_blank">
💬
</a>

<script>

let images=[];
let titles=[];
let current=0;
let autoSlide;

/* MENU */
function openMenu(){
document.getElementById("menu").classList.toggle("active");
}

/* OPEN SERVICE */
function openService(type){

current=0;

if(type==="eau"){
images=[
"réseaux-d'eaux-potable.jpg",
"detection-des-fuites.jpg",
"local.png"
];

titles=[
"Réseaux d'eau potable",
"Détection des fuites",
"Projet terrain"
];

document.getElementById("modal-title").innerText="Réseaux d'eau potable";
document.getElementById("modal-text").innerText="Installation, maintenance, détection des fuites.";
}

if(type==="assainissement"){
images=["réseaux-d'assainissement.jpg"];
titles=["Travaux assainissement"];

document.getElementById("modal-title").innerText="Assainissement";
document.getElementById("modal-text").innerText="Réseaux d’évacuation et travaux complets.";
}

if(type==="genie"){
images=["genie-civil.jpg"];
titles=["Génie civil"];

document.getElementById("modal-title").innerText="Génie civil";
document.getElementById("modal-text").innerText="Travaux béton et infrastructure.";
}

document.getElementById("modal").style.display="flex";

showSlide();

clearInterval(autoSlide);
autoSlide=setInterval(next,3000);

}

/* SHOW */
function showSlide(){
document.getElementById("slide-img").src=images[current];
document.getElementById("slide-title").innerText=titles[current];
}

/* NEXT */
function next(){
current=(current+1)%images.length;
showSlide();
}

/* PREV */
function prev(){
current=(current-1+images.length)%images.length;
showSlide();
}

/* CLOSE */
function closeModal(){
document.getElementById("modal").style.display="none";
clearInterval(autoSlide);
}

</script>

</body>
</html>
