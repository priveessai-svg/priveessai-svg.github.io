<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SMERAV</title>

<style>

/* RESET */
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial;}

/* HEADER */
header{
position:fixed;
top:0;
left:0;
width:100%;
display:flex;
justify-content:space-between;
align-items:center;
padding:15px 20px;
z-index:1000;
}

.logo{height:45px;}

/* MENU */
.menu-btn{font-size:30px;color:white;cursor:pointer;}

.menu{
position:fixed;
top:0;
right:-100%;
width:100%;
height:100%;
background:black;
color:white;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
transition:0.5s;
z-index:2000;
}

.menu.active{right:0;}

.menu a{
color:white;
font-size:25px;
margin:15px;
text-decoration:none;
}

.close-menu{
position:absolute;
top:20px;
right:20px;
font-size:30px;
cursor:pointer;
}

/* HERO */
.hero{
height:100vh;
background:url("local.png") center/cover no-repeat;
display:flex;
justify-content:center;
align-items:center;
color:white;
text-align:center;
position:relative;
}

.hero::after{
content:"";
position:absolute;
width:100%;
height:100%;
background:rgba(0,0,0,0.6);
}

.hero-content{
position:relative;
z-index:2;
animation:fadeUp 1.5s;
}

/* SERVICES */
section{padding:80px 20px;text-align:center;}

.services{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
}

.card{
background:#f5f5f5;
padding:20px;
border-radius:10px;
cursor:pointer;
transition:0.3s;
}

.card:hover{transform:translateY(-5px);}

/* MODAL */
.modal{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.8);
justify-content:center;
align-items:center;
z-index:3000;
}

.modal-content{
background:white;
padding:20px;
border-radius:10px;
width:90%;
max-width:400px;
text-align:center;
position:relative;
}

.modal-img{
width:100%;
border-radius:10px;
transition:0.5s;
}

.slider-btn{
margin:10px;
padding:8px 15px;
border:none;
background:#007BFF;
color:white;
border-radius:5px;
cursor:pointer;
}

/* ANIMATION */
@keyframes fadeUp{
from{opacity:0;transform:translateY(30px);}
to{opacity:1;transform:translateY(0);}
}

</style>
</head>

<body>

<!-- HEADER -->
<header>
<a href="#"><img src="logo-transparent.png" class="logo"></a>
<div class="menu-btn" onclick="openMenu()">☰</div>
</header>

<!-- MENU -->
<div class="menu" id="menu">
<div class="close-menu" onclick="closeMenu()">✕</div>
<a href="#">Accueil</a>
<a href="#services">Services</a>
<a href="#contact">Contact</a>
</div>

<!-- HERO -->
<section class="hero">
<div class="hero-content">
<h1>SMERAV</h1>
<p>Notre expertise, votre réussite</p>
</div>
</section>

<!-- SERVICES -->
<section id="services">
<h2>Nos Services</h2>

<div class="services">

<div class="card" onclick="openService('eau')">
<h3>Réseaux d'eau potable</h3>
<p>Installation et maintenance</p>
</div>

<div class="card" onclick="openService('assainissement')">
<h3>Assainissement</h3>
<p>Travaux complets</p>
</div>

<div class="card" onclick="openService('genie')">
<h3>Génie civil</h3>
<p>Travaux professionnels</p>
</div>

</div>
</section>

<!-- CONTACT -->
<section id="contact">
<h2>Contact</h2>
<p>Fès, Maroc</p>
<p>+212 661 80 88 94</p>
</section>

<!-- MODAL -->
<div id="modal" class="modal">
<div class="modal-content">

<span onclick="closeModal()" style="position:absolute;right:15px;top:10px;cursor:pointer;">✕</span>

<h2 id="modal-title"></h2>
<p id="modal-text"></p>

<img id="slide" class="modal-img">

<div>
<button class="slider-btn" onclick="prevSlide()">⬅</button>
<button class="slider-btn" onclick="nextSlide()">➡</button>
</div>

</div>
</div>

<script>

/* MENU */
function openMenu(){document.getElementById("menu").classList.add("active");}
function closeMenu(){document.getElementById("menu").classList.remove("active");}

/* SLIDER */
let images = [];
let current = 0;
let autoSlide;

/* OPEN SERVICE */
function openService(type){

if(type==="eau"){
images=["réseaux-d'eaux-potable.jpg","detection-des-fuites.jpg"];
document.getElementById("modal-title").innerText="Réseaux d'eau potable";
document.getElementById("modal-text").innerText="Installation complète + maintenance.";
}

if(type==="assainissement"){
images=["réseaux-d'assainissement.jpg"];
document.getElementById("modal-title").innerText="Assainissement";
document.getElementById("modal-text").innerText="Travaux d’évacuation.";
}

if(type==="genie"){
images=["genie-civil.jpg"];
document.getElementById("modal-title").innerText="Génie civil";
document.getElementById("modal-text").innerText="Travaux de construction.";
}

current=0;
showSlide();

document.getElementById("modal").style.display="flex";

/* AUTO SLIDER */
autoSlide = setInterval(nextSlide,3000);
}

/* SHOW */
function showSlide(){
document.getElementById("slide").src=images[current];
}

/* NEXT */
function nextSlide(){
current++;
if(current>=images.length){current=0;}
showSlide();
}

/* PREV */
function prevSlide(){
current--;
if(current<0){current=images.length-1;}
showSlide();
}

/* CLOSE */
function closeModal(){
document.getElementById("modal").style.display="none";
clearInterval(autoSlide);
}

</script>

</body>
</html>
