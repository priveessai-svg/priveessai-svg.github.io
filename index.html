<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SMERAV</title>

<!-- SEO -->
<meta name="description" content="SMERAV travaux publics à Fès : réseaux d’eau potable, assainissement, génie civil.">
<meta name="keywords" content="travaux publics Fès, eau potable Maroc, assainissement Fès">

<!-- SPEED -->
<link rel="preload" as="image" href="local.png">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#f5f5f5}

/* NAVBAR */
.nav{
position:fixed;top:0;width:100%;
display:flex;justify-content:space-between;align-items:center;
padding:12px 20px;
background:rgba(0,0,0,0.5);
backdrop-filter:blur(10px);
z-index:999;
}
.logo{height:50px}
.menu-btn{font-size:28px;color:white;cursor:pointer}

/* OVERLAY */
.overlay{
position:fixed;width:100%;height:100%;
background:rgba(0,0,0,0.5);
opacity:0;visibility:hidden;transition:0.3s;
}
.overlay.active{opacity:1;visibility:visible}

/* MENU */
.menu{
position:fixed;top:0;right:-280px;
width:260px;height:100%;
background:black;
padding:30px;transition:0.4s;
}
.menu.active{right:0}
.menu a{color:white;display:block;margin:10px 0;text-decoration:none}
.close-btn{color:white;font-size:25px;cursor:pointer}

/* HERO */
.hero{
height:100vh;
background:url("local.png?v=6") center/cover no-repeat;
display:flex;justify-content:center;align-items:center;
color:white;text-align:center;
}
.hero-text{background:rgba(0,0,0,0.5);padding:20px;border-radius:10px}

/* SECTION */
.section{padding:70px 20px;text-align:center}

/* ANIMATION */
.fade{opacity:0;transform:translateY(20px);transition:0.6s}
.fade.show{opacity:1;transform:translateY(0)}

/* SERVICES */
.service{
background:white;margin:10px auto;padding:15px;border-radius:12px;
width:90%;max-width:400px;cursor:pointer;
}
.gallery{display:none;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.gallery.active{display:grid}
.gallery img{width:100%;height:180px;object-fit:cover;border-radius:10px}

/* OFFRE */
.offre img{
width:90%;
max-width:800px;
margin:auto;
display:block;
border-radius:10px;
}

/* PROJECT */
.projects img{
width:90%;
margin:10px auto;
display:block;
border-radius:10px;
}

/* CONTACT */
input,textarea{
width:90%;margin:10px;padding:12px;border:none;background:#eee;border-radius:10px;
}
button{
background:gold;padding:12px 20px;border:none;border-radius:10px;cursor:pointer;
}
#successMsg{
display:none;background:green;color:white;padding:10px;margin-top:10px;border-radius:8px;
}

/* MAP */
.map-box{height:350px;border-radius:20px;overflow:hidden}
.map-box iframe{width:100%;height:100%}

/* WHATSAPP */
.whatsapp{
position:fixed;bottom:20px;right:20px;
background:#25D366;color:white;padding:15px;border-radius:50%;
}

/* SCROLL TOP */
.scrollTop{
position:fixed;bottom:90px;right:20px;
background:black;color:white;border:none;padding:10px;border-radius:50%;
}
</style>
</head>

<body>

<!-- NAV -->
<div class="nav">
<img src="logo-transparent.png?v=6" class="logo">
<div class="menu-btn" onclick="toggleMenu()">☰</div>
</div>

<div class="overlay" id="overlay" onclick="closeMenu()"></div>

<div class="menu" id="menu">
<div class="close-btn" onclick="closeMenu()">✕</div>
<a href="#services">Services</a>
<a href="#offre">Offre</a>
<a href="#projects">Projets</a>
<a href="#contact">Contact</a>
</div>

<!-- HERO -->
<section class="hero fade">
<div class="hero-text">
<h1>SMERAV</h1>
<p>Notre expertise, votre réussite</p>
</div>
</section>

<!-- ABOUT -->
<section class="section fade">
<h2>About</h2>
<p>Entreprise de travaux publics à Fès spécialisée en eau et assainissement.</p>
</section>

<!-- SERVICES -->
<section class="section fade" id="services">
<h2>Nos Services</h2>

<div class="service" onclick="show('eau')">Réseaux d'eau potable</div>
<div id="eau" class="gallery">
<img src="reseaux-eaux-potable.jpg?v=6">
<img src="branchement-eaux.jpg?v=6">
</div>

</section>

<!-- OFFRE -->
<section class="section offre fade" id="offre">
<h2>Offre de Services</h2>
<img src="offre.png?v=6">
</section>

<!-- PROJECT -->
<section class="section projects fade" id="projects">
<h2>Nos Projets</h2>
<img src="projet1.jpg?v=6">
<img src="projet3.jpg?v=6">
</section>

<!-- CONTACT -->
<section class="section fade" id="contact">
<h2>Contact</h2>

<form id="contactForm">
<input name="name" placeholder="Nom" required>
<input name="email" placeholder="Email" required>
<textarea name="message" placeholder="Message"></textarea>
<button>Envoyer</button>
</form>

<div id="successMsg">Message envoyé avec succès</div>

</section>

<!-- MAP -->
<section class="section fade">
<h2>Localisation</h2>
<div class="map-box">
<iframe src="https://www.google.com/maps?q=Fes,Morocco&output=embed"></iframe>
</div>
</section>

<!-- WHATSAPP -->
<a class="whatsapp" href="https://wa.me/212661808894?text=Bonjour%20SMERAV%2C%20je%20souhaite%20un%20devis">💬</a>

<!-- SCROLL TOP -->
<button class="scrollTop" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</button>

<script>
function toggleMenu(){
menu.classList.toggle("active");
overlay.classList.toggle("active");
}
function closeMenu(){
menu.classList.remove("active");
overlay.classList.remove("active");
}
function show(id){
document.getElementById(id).classList.toggle("active");
}

/* CONTACT */
document.getElementById("contactForm").addEventListener("submit",function(e){
e.preventDefault();
fetch("https://formsubmit.co/ajax/sarl.smerav@gmail.com",{
method:"POST",
body:new FormData(this)
})
.then(()=>{
document.getElementById("successMsg").style.display="block";
this.reset();
});
});

/* ANIMATION */
const elements=document.querySelectorAll('.fade');
window.addEventListener('scroll',()=>{
elements.forEach(el=>{
if(el.getBoundingClientRect().top < window.innerHeight-50){
el.classList.add('show');
}
});
});
</script>

</body>
</html>
