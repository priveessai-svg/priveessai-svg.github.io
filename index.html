<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SMERAV</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}

/* LOADER */
#loader{
position:fixed;
top:0;left:0;
width:100%;height:100%;
background:#000814;
display:flex;
justify-content:center;
align-items:center;
z-index:9999;
}
#loader.hide{display:none}

.spinner{
width:50px;height:50px;
border:4px solid rgba(255,255,255,0.2);
border-top:4px solid white;
border-radius:50%;
animation:spin 1s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* HERO ANIMATION */
.hero-text h1{
opacity:0;
transform:translateY(40px);
animation:fadeUp 1s forwards 0.5s;
}
.hero-text p{
opacity:0;
transform:translateY(40px);
animation:fadeUp 1s forwards 1s;
}
@keyframes fadeUp{
to{opacity:1;transform:translateY(0);}
}

/* BUTTON */
button,a[href*="wa.me"]{
animation:pulse 2s infinite;
}
@keyframes pulse{
50%{transform:scale(1.05);}
}

/* MENU */
.menu a{
opacity:0;
transform:translateX(30px);
}
.menu.active a{
animation:menuFade 0.5s forwards;
}
.menu.active a:nth-child(1){animation-delay:0.2s;}
.menu.active a:nth-child(2){animation-delay:0.3s;}
.menu.active a:nth-child(3){animation-delay:0.4s;}
.menu.active a:nth-child(4){animation-delay:0.5s;}
.menu.active a:nth-child(5){animation-delay:0.6s;}

@keyframes menuFade{
to{opacity:1;transform:translateX(0);}
}

/* ORIGINAL */
body{background:#f5f5f5}

.nav{
position:fixed;top:0;width:100%;
display:flex;justify-content:space-between;
align-items:center;padding:12px 20px;
background:rgba(0,0,0,0.5);
z-index:999;
}

.logo{height:50px}

.menu-btn{
font-size:28px;color:white;
background:rgba(0,0,0,0.5);
padding:8px 12px;border-radius:8px;
cursor:pointer;
}

.overlay{
position:fixed;top:0;left:0;width:100%;height:100%;
background:rgba(0,0,0,0.5);
opacity:0;visibility:hidden;
}
.overlay.active{opacity:1;visibility:visible}

.menu{
position:fixed;top:0;right:-280px;
width:260px;height:100%;
background:black;
display:flex;flex-direction:column;
padding:30px 20px;
transition:0.4s;
}
.menu.active{right:0}

.close-btn{color:white;font-size:26px;cursor:pointer}

.menu a{color:white;margin:10px 0;text-decoration:none}

.hero{
height:100vh;
background:url("local.png?v=6") center/cover no-repeat;
display:flex;justify-content:center;
align-items:center;color:white;text-align:center;
}

.hero-text{
background:rgba(0,0,0,0.5);
padding:20px;border-radius:10px;
}

.section{padding:70px 20px;text-align:center}

.service{
background:white;margin:10px auto;
padding:15px;border-radius:12px;
width:90%;max-width:400px;
cursor:pointer;
}

.gallery{display:none}
.gallery.active{display:grid}

.gallery img{
width:100%;height:180px;
object-fit:cover;border-radius:10px;
}

.offre img{width:90%;max-width:800px}

.projects img{width:90%;margin:10px}

input,textarea{
width:90%;margin:10px;
padding:12px;background:#eee;
border-radius:10px;border:none;
}

button{
background:gold;padding:12px 20px;
border:none;border-radius:10px;
}

.map-box{height:350px;margin-top:20px}
.map-box iframe{width:100%;height:100%}

.whatsapp{
position:fixed;bottom:20px;right:20px;
background:#25D366;color:white;
padding:15px;border-radius:50%;
text-decoration:none;
}

#successMsg{
display:none;background:green;color:white;
padding:10px;margin-top:10px;
}
</style>
</head>

<body>

<div id="loader"><div class="spinner"></div></div>

<div class="nav">
<img src="logo-transparent.png?v=6" class="logo">
<div class="menu-btn" onclick="toggleMenu()">☰</div>
</div>

<div class="overlay" id="overlay" onclick="closeMenu()"></div>

<div class="menu" id="menu">
<div class="close-btn" onclick="closeMenu()">✕</div>
<a href="#services">Services</a>
<a href="#offre">Offre</a>
<a href="#projects">Projets</a>
<a href="#contact">Contact</a>
</div>

<section class="hero">
<div class="hero-text">
<h1>SMERAV</h1>
<p>Notre expertise, votre réussite</p>
</div>
</section>

<section class="section" id="services">
<h2>Nos Services</h2>
<div class="service">Réseaux d'eau potable</div>
<div class="service">Assainissement</div>
<div class="service">Génie civil</div>
</section>

<section class="section" id="offre">
<h2>Offre</h2>
<img src="offre.png?v=6">
</section>

<section class="section" id="projects">
<h2>Projets</h2>
<img src="projet1.jpg?v=6">
</section>

<section class="section" id="contact">
<h2>Contact</h2>
<form id="contactForm">
<input type="text" name="name" placeholder="Nom" required>
<input type="email" name="email" placeholder="Email" required>
<textarea name="message" placeholder="Message"></textarea>
<button>Envoyer</button>
</form>
<div id="successMsg">Message envoyé</div>
</section>

<section class="section">
<div class="map-box">
<iframe src="https://www.google.com/maps?q=Fes,Morocco&output=embed"></iframe>
</div>
</section>

<a class="whatsapp" href="https://wa.me/212661808894">💬</a>

<script>
window.onload=()=>{document.getElementById("loader").classList.add("hide")}

function toggleMenu(){
menu.classList.toggle("active")
overlay.classList.toggle("active")
}
function closeMenu(){
menu.classList.remove("active")
overlay.classList.remove("active")
}

/* CONTACT FIX */
const form=document.getElementById("contactForm");
if(form){
form.addEventListener("submit",function(e){
e.preventDefault();
fetch("https://formsubmit.co/ajax/sarl.smerav@gmail.com",{
method:"POST",
body:new FormData(this)
}).then(()=>{
successMsg.style.display="block";
this.reset();
});
});
}
</script>

</body>
</html>
