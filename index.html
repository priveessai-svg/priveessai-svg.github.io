<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SMERAV</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}

/* ===== LOADER ===== */
#loader{
position:fixed;
top:0;left:0;
width:100%;height:100%;
background:#000814;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
z-index:9999;
color:white;
transition:0.8s;
}
#loader.hide{opacity:0;visibility:hidden}

.spinner{
width:50px;height:50px;
border:4px solid rgba(255,255,255,0.2);
border-top:4px solid white;
border-radius:50%;
animation:spin 1s linear infinite;
margin-bottom:15px;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* ===== BACKGROUND ===== */
body{
background:linear-gradient(135deg,#0a1f44,#08142c,#000814);
overflow-x:hidden;
}

/* ===== MENU GLASS ===== */
.menu{
background:rgba(0,0,0,0.6) !important;
backdrop-filter:blur(15px);
-webkit-backdrop-filter:blur(15px);
border-left:1px solid rgba(255,255,255,0.1);
}

/* ===== MENU ANIMATION ===== */
.menu a{
opacity:0;
transform:translateX(30px);
transition:all 0.4s ease;
}

.menu.active a{
opacity:1;
transform:translateX(0);
}

.menu.active a:nth-of-type(1){transition-delay:0.1s;}
.menu.active a:nth-of-type(2){transition-delay:0.2s;}
.menu.active a:nth-of-type(3){transition-delay:0.3s;}
.menu.active a:nth-of-type(4){transition-delay:0.4s;}
.menu.active a:nth-of-type(5){transition-delay:0.5s;}

/* hover */
.menu a{
position:relative;
}

.menu a::after{
content:"";
position:absolute;
left:0;
bottom:-3px;
width:0;
height:2px;
background:gold;
transition:0.3s;
}

.menu a:hover::after{
width:100%;
}

.menu a:hover{
color:gold;
transform:translateX(5px);
}

/* ===== ANIMATION ===== */
.section{
opacity:0;
transform:translateY(50px);
transition:1s;
}
.section.show{
opacity:1;
transform:translateY(0);
}

/* ===== ORIGINAL ===== */
body{background:#f5f5f5}

/* NAVBAR */
.nav{
position:fixed;
top:0;
width:100%;
display:flex;
justify-content:space-between;
align-items:center;
padding:12px 20px;
background:rgba(0,0,0,0.5);
backdrop-filter:blur(10px);
z-index:999;
}

.logo{height:50px}

.menu-btn{
font-size:28px;
color:white;
background:rgba(0,0,0,0.5);
padding:8px 12px;
border-radius:8px;
cursor:pointer;
}

/* OVERLAY */
.overlay{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.5);
opacity:0;
visibility:hidden;
transition:0.3s;
z-index:998;
}
.overlay.active{opacity:1;visibility:visible}

/* MENU */
.menu{
position:fixed;
top:0;
right:-280px;
width:260px;
height:100%;
display:flex;
flex-direction:column;
padding:30px 20px;
transition:0.4s;
z-index:999;
}
.menu.active{right:0}

.close-btn{
color:white;
font-size:26px;
align-self:flex-end;
cursor:pointer;
margin-bottom:20px;
}

.menu a{
color:white;
font-size:20px;
margin:10px 0;
text-decoration:none;
}

/* DROPDOWN */
.dropdown-title{
color:white;
font-size:20px;
display:flex;
justify-content:space-between;
cursor:pointer;
margin:10px 0;
}

.dropdown-content{
max-height:0;
overflow:hidden;
transition:0.4s;
}

.dropdown-content a{
display:block;
color:#ccc;
margin:5px 0;
}

.dropdown.active .dropdown-content{
max-height:300px;
}

.dropdown.active .arrow{
transform:rotate(180deg);
}

/* HERO */
.hero{
height:100vh;
background:url("local.png?v=6") center/cover no-repeat;
display:flex;
justify-content:center;
align-items:center;
color:white;
text-align:center;
}

.hero-text{
background:rgba(0,0,0,0.5);
padding:20px;
border-radius:10px;
}

/* SECTION */
.section{
padding:70px 20px;
text-align:center;
}

/* SERVICES */
.service{
background:white;
margin:10px auto;
padding:15px;
border-radius:12px;
width:90%;
max-width:400px;
cursor:pointer;
}

/* GALLERY */
.gallery{
display:none;
grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
gap:10px;
margin-top:10px;
}
.gallery.active{display:grid}

.gallery img{
width:100%;
height:180px;
object-fit:cover;
border-radius:10px;
}

/* OFFRE */
.offre img{
width:90%;
max-width:800px;
border-radius:10px;
}

/* PROJECT */
.projects img{
width:90%;
margin:10px;
border-radius:10px;
}

/* CONTACT */
input,textarea{
width:90%;
margin:10px;
padding:12px;
border:none;
background:#eee;
border-radius:10px;
}

button{
background:gold;
padding:12px 20px;
border:none;
border-radius:10px;
}

/* MAP */
.map-box{
position:relative;
height:350px;
border-radius:20px;
overflow:hidden;
margin-top:20px;
}

.map-box iframe{
width:100%;
height:100%;
border:0;
}

/* WHATSAPP */
.whatsapp{
position:fixed;
bottom:20px;
right:20px;
background:#25D366;
color:white;
padding:15px;
border-radius:50%;
text-decoration:none;
}

/* SUCCESS */
#successMsg{
display:none;
background:green;
color:white;
padding:10px;
margin-top:10px;
border-radius:8px;
}
</style>
</head>

<body>

<!-- LOADER -->
<div id="loader">
<div class="spinner"></div>
<h2>SMERAV</h2>
</div>

<!-- NAVBAR -->
<div class="nav">
<img src="logo-transparent.png?v=6" class="logo">
<div class="menu-btn" onclick="toggleMenu()">☰</div>
</div>

<div class="overlay" id="overlay" onclick="closeMenu()"></div>

<!-- MENU -->
<div class="menu" id="menu">

<div class="close-btn" onclick="closeMenu()">✕</div>

<div class="dropdown">
<div class="dropdown-title" onclick="toggleDropdown(this)">
Services <span class="arrow">⌄</span>
</div>
<div class="dropdown-content">
<a href="#services" onclick="closeMenu()">Réseaux d'eau potable</a>
<a href="#services" onclick="closeMenu()">Assainissement</a>
<a href="#services" onclick="closeMenu()">Génie civil</a>
<a href="#services" onclick="closeMenu()">Forage et équipement</a>
<a href="#services" onclick="closeMenu()">Vente pièces réseaux</a>
</div>
</div>

<a href="#offre" onclick="closeMenu()">Offre</a>
<a href="#projects" onclick="closeMenu()">Projets</a>
<a href="#contact" onclick="closeMenu()">Contact</a>

</div>

<!-- HERO -->
<section class="hero" id="home">
<div class="hero-text">
<h1>SMERAV</h1>
<p>Notre expertise, votre réussite</p>
</div>
</section>

<!-- باقي الكود ديالك كما هو (ما تبدل حتى حاجة) -->

<script>
window.addEventListener("load",()=>{
document.getElementById("loader").classList.add("hide");
});
function toggleMenu(){
menu.classList.toggle("active");
overlay.classList.toggle("active");
}
function closeMenu(){
menu.classList.remove("active");
overlay.classList.remove("active");
}
function toggleDropdown(el){
el.parentElement.classList.toggle("active");
}
function show(id){
document.getElementById(id).classList.toggle("active");
}
</script>

</body>
</html>
