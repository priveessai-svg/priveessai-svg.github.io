<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SMERAV</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#f5f5f5}

/* NAV */
.nav{
position:fixed;
top:0;
width:100%;
display:flex;
justify-content:space-between;
padding:15px;
background:rgba(0,0,0,0.4);
backdrop-filter:blur(12px);
z-index:999;
}

.logo{height:50px}

.menu-btn{
font-size:28px;
color:white;
cursor:pointer;
}

/* MENU */
.menu{
position:fixed;
top:0;
right:-100%;
width:100%;
height:100%;
background:black;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
transition:0.5s;
}

.menu a{
color:white;
font-size:30px;
margin:20px;
text-decoration:none;
transition:0.3s;
}

.menu a:hover{
color:gold;
transform:scale(1.1);
}

.menu.active{right:0}

/* HERO SLIDER */
.hero{
height:100vh;
position:relative;
overflow:hidden;
display:flex;
align-items:center;
justify-content:center;
color:white;
text-align:center;
}

.slide{
position:absolute;
width:100%;
height:100%;
object-fit:cover;
opacity:0;
transition:1s;
}

.slide.active{opacity:1}

.hero-text{
position:relative;
z-index:2;
background:rgba(0,0,0,0.5);
padding:25px;
border-radius:12px;
}

/* SECTION */
.section{
padding:80px 20px;
text-align:center;
opacity:0;
transform:translateY(40px);
transition:0.8s;
}
.section.show{
opacity:1;
transform:translateY(0);
}

/* SERVICES */
.service{
background:white;
margin:15px auto;
padding:15px;
border-radius:12px;
width:90%;
max-width:400px;
cursor:pointer;
transition:0.3s;
}
.service:hover{
transform:scale(1.05);
}

/* GALLERY */
.gallery{
display:none;
grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
gap:10px;
}
.gallery.active{display:grid}

.gallery img{
width:100%;
height:180px;
object-fit:cover;
border-radius:10px;
transition:0.3s;
}
.gallery img:hover{
transform:scale(1.1);
}

/* MAP */
.map-box{
height:350px;
border-radius:20px;
overflow:hidden;
margin-top:20px;
}

/* WHATSAPP */
.whatsapp{
position:fixed;
bottom:20px;
right:20px;
background:#25D366;
color:white;
padding:15px;
border-radius:50%;
}
</style>
</head>

<body>

<!-- NAV -->
<div class="nav">
<img src="logo-transparent.png" class="logo">
<div class="menu-btn" onclick="toggleMenu()">☰</div>
</div>

<!-- MENU -->
<div class="menu" id="menu">
<a href="#home" onclick="closeMenu()">Accueil</a>
<a href="#services" onclick="closeMenu()">Services</a>
<a href="#offre" onclick="closeMenu()">Offre</a>
<a href="#projects" onclick="closeMenu()">Projets</a>
<a href="#contact" onclick="closeMenu()">Contact</a>
</div>

<!-- HERO -->
<section class="hero" id="home">
<img src="local.png" class="slide active">
<img src="projet1.jpg" class="slide">
<img src="projet3.jpg" class="slide">

<div class="hero-text">
<h1>SMERAV</h1>
<p>Votre partenaire en travaux publics</p>
</div>
</section>

<!-- ABOUT -->
<section class="section">
<h2>About</h2>
<p>Entreprise basée à Fès spécialisée en travaux publics.</p>
</section>

<!-- SERVICES -->
<section class="section" id="services">
<h2>Nos Services</h2>

<div class="service" onclick="show('eau')">Réseaux d'eau potable</div>
<div id="eau" class="gallery">
<img src="reseaux-eaux-potable.jpg">
<img src="branchement-eaux.jpg">
<img src="raccordement-eau.jpg">
</div>

<div class="service" onclick="show('assainissement')">Assainissement</div>
<div id="assainissement" class="gallery">
<img src="reseaux-assainissement1.jpg">
</div>

</section>

<!-- MAP -->
<section class="section">
<h2>Localisation</h2>
<div class="map-box">
<iframe src="https://www.google.com/maps?q=Fes,Morocco&output=embed" width="100%" height="100%"></iframe>
</div>
</section>

<!-- WHATSAPP -->
<a href="https://wa.me/212661808894" class="whatsapp">💬</a>

<script>
function toggleMenu(){
document.getElementById("menu").classList.toggle("active");
}
function closeMenu(){
document.getElementById("menu").classList.remove("active");
}
function show(id){
document.getElementById(id).classList.toggle("active");
}

/* SLIDER */
let slides=document.querySelectorAll(".slide");
let i=0;
setInterval(()=>{
slides[i].classList.remove("active");
i=(i+1)%slides.length;
slides[i].classList.add("active");
},4000);

/* SCROLL ANIMATION */
const sections=document.querySelectorAll(".section");
window.addEventListener("scroll",()=>{
sections.forEach(sec=>{
if(sec.getBoundingClientRect().top < window.innerHeight-100){
sec.classList.add("show");
}
});
});
</script>

</body>
</html>
