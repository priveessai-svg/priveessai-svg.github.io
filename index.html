<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SMERAV</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}

/* ===== LOADER ===== */
#loader{
position:fixed;
top:0;left:0;
width:100%;height:100%;
background:#000814;
display:flex;
justify-content:center;
align-items:center;
z-index:9999;
transition:0.8s;
}
#loader.hide{opacity:0;visibility:hidden}

.spinner{
width:50px;height:50px;
border:4px solid rgba(255,255,255,0.2);
border-top:4px solid white;
border-radius:50%;
animation:spin 1s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* ===== HERO ANIMATION ===== */
.hero-text h1{
opacity:0;
transform:translateY(40px);
animation:fadeUp 1s ease forwards;
animation-delay:0.5s;
}
.hero-text p{
opacity:0;
transform:translateY(40px);
animation:fadeUp 1s ease forwards;
animation-delay:1s;
}
@keyframes fadeUp{
to{opacity:1;transform:translateY(0);}
}

/* ===== BUTTON PULSE ===== */
button,
a[href*="wa.me"]{
animation:pulse 2s infinite;
}
@keyframes pulse{
0%{transform:scale(1);}
50%{transform:scale(1.05);}
100%{transform:scale(1);}
}

/* ===== MENU ANIMATION ===== */
.menu a{
position:relative;
opacity:0;
transform:translateX(30px);
}

/* stagger */
.menu.active a{
animation:menuFade 0.5s forwards;
}
.menu.active a:nth-child(1){animation-delay:0.2s;}
.menu.active a:nth-child(2){animation-delay:0.3s;}
.menu.active a:nth-child(3){animation-delay:0.4s;}
.menu.active a:nth-child(4){animation-delay:0.5s;}
.menu.active a:nth-child(5){animation-delay:0.6s;}

@keyframes menuFade{
to{
opacity:1;
transform:translateX(0);
}
}

/* hover effect */
.menu a::after{
content:"";
position:absolute;
bottom:-3px;
left:0;
width:0;
height:2px;
background:gold;
transition:0.3s;
}
.menu a:hover::after{
width:100%;
}
.menu a:hover{
color:gold;
transform:translateX(5px);
}

/* ===== SCROLL ANIMATION ===== */
.section{
opacity:0;
transform:translateY(50px);
transition:1s;
}
.section.show{
opacity:1;
transform:translateY(0);
}

/* ===== الكود ديالك ===== */
body{background:#f5f5f5}

/* NAVBAR */
.nav{
position:fixed;
top:0;
width:100%;
display:flex;
justify-content:space-between;
align-items:center;
padding:12px 20px;
background:rgba(0,0,0,0.5);
backdrop-filter:blur(10px);
z-index:999;
}

.logo{height:50px}

.menu-btn{
font-size:28px;
color:white;
background:rgba(0,0,0,0.5);
padding:8px 12px;
border-radius:8px;
cursor:pointer;
}

/* OVERLAY */
.overlay{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.5);
opacity:0;
visibility:hidden;
transition:0.3s;
z-index:998;
}
.overlay.active{opacity:1;visibility:visible}

/* MENU */
.menu{
position:fixed;
top:0;
right:-280px;
width:260px;
height:100%;
background:black;
display:flex;
flex-direction:column;
padding:30px 20px;
transition:0.4s;
z-index:999;
}
.menu.active{right:0}

.close-btn{
color:white;
font-size:26px;
align-self:flex-end;
cursor:pointer;
margin-bottom:20px;
}

.menu a{
color:white;
font-size:20px;
margin:10px 0;
text-decoration:none;
}

/* HERO */
.hero{
height:100vh;
background:url("local.png?v=6") center/cover no-repeat;
display:flex;
justify-content:center;
align-items:center;
color:white;
text-align:center;
}

.hero-text{
background:rgba(0,0,0,0.5);
padding:20px;
border-radius:10px;
}

/* SECTION */
.section{
padding:70px 20px;
text-align:center;
}

/* SERVICES */
.service{
background:white;
margin:10px auto;
padding:15px;
border-radius:12px;
width:90%;
max-width:400px;
cursor:pointer;
}
.service:hover{background:#eee}

/* GALLERY */
.gallery{
display:none;
grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
gap:10px;
margin-top:10px;
}
.gallery.active{display:grid}

.gallery img{
width:100%;
height:180px;
object-fit:cover;
border-radius:10px;
}

/* OFFRE */
.offre img{
width:90%;
max-width:800px;
border-radius:10px;
}

/* PROJECT */
.projects img{
width:90%;
margin:10px;
border-radius:10px;
}

/* CONTACT */
input,textarea{
width:90%;
margin:10px;
padding:12px;
border:none;
background:#eee;
border-radius:10px;
}

button{
background:gold;
padding:12px 20px;
border:none;
border-radius:10px;
}

/* MAP */
.map-box{
position:relative;
height:350px;
border-radius:20px;
overflow:hidden;
margin-top:20px;
}

.map-box iframe{
width:100%;
height:100%;
border:0;
}

/* WHATSAPP */
.whatsapp{
position:fixed;
bottom:20px;
right:20px;
background:#25D366;
color:white;
padding:15px;
border-radius:50%;
text-decoration:none;
}

/* SUCCESS */
#successMsg{
display:none;
background:green;
color:white;
padding:10px;
margin-top:10px;
border-radius:8px;
}
</style>
</head>

<body>

<!-- LOADER -->
<div id="loader"><div class="spinner"></div></div>

<!-- (خلي HTML ديالك كامل كما هو هنا) -->

<script>

/* LOADER */
window.addEventListener("load",()=>{
document.getElementById("loader").classList.add("hide");
});

/* MENU */
function toggleMenu(){
document.getElementById("menu").classList.toggle("active");
document.getElementById("overlay").classList.toggle("active");
}
function closeMenu(){
document.getElementById("menu").classList.remove("active");
document.getElementById("overlay").classList.remove("active");
}
function toggleDropdown(el){
el.parentElement.classList.toggle("active");
}
function show(id){
document.getElementById(id).classList.toggle("active");
}

/* CONTACT */
document.getElementById("contactForm").addEventListener("submit",function(e){
e.preventDefault();
fetch("https://formsubmit.co/ajax/sarl.smerav@gmail.com",{
method:"POST",
body:new FormData(this)
}).then(()=>{
document.getElementById("successMsg").style.display="block";
this.reset();
});
});

/* SCROLL */
const sections=document.querySelectorAll(".section");
window.addEventListener("scroll",()=>{
sections.forEach(sec=>{
if(sec.getBoundingClientRect().top < window.innerHeight-80){
sec.classList.add("show");
}
});
});

</script>

</body>
</html>
