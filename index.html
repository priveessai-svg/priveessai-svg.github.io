<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SMERAV</title>

<style>

/* RESET */
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, sans-serif;
}

/* HEADER */
header{
position:fixed;
top:0;
left:0;
width:100%;
display:flex;
justify-content:space-between;
align-items:center;
padding:15px 20px;
z-index:1000;
}

.logo{
height:45px;
}

/* MENU ICON */
.menu-btn{
font-size:30px;
color:white;
cursor:pointer;
}

/* HERO */
.hero{
height:100vh;
background:url("local.png") center/cover no-repeat;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
color:white;
position:relative;
}

.hero::after{
content:"";
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.5);
}

.hero-content{
position:relative;
z-index:2;
animation:fadeUp 1.5s ease;
}

.hero h1{
font-size:40px;
}

.hero p{
margin-top:10px;
font-size:18px;
}

/* MENU FULLSCREEN */
.menu{
position:fixed;
top:0;
right:-100%;
width:100%;
height:100%;
background:black;
color:white;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
transition:0.5s;
z-index:2000;
}

.menu.active{
right:0;
}

.menu a{
color:white;
font-size:25px;
margin:15px;
text-decoration:none;
}

.close{
position:absolute;
top:20px;
right:20px;
font-size:30px;
cursor:pointer;
}

/* SERVICES */
section{
padding:80px 20px;
text-align:center;
}

.services{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
}

.card{
background:#f5f5f5;
padding:20px;
border-radius:10px;
transition:0.3s;
}

.card:hover{
transform:translateY(-5px);
}

/* ANIMATION */
@keyframes fadeUp{
from{opacity:0; transform:translateY(30px);}
to{opacity:1; transform:translateY(0);}
}

</style>
</head>

<body>

<!-- HEADER -->
<header>
<a href="#">
<img src="logo-transparent.png" class="logo">
</a>

<div class="menu-btn" onclick="openMenu()">☰</div>
</header>

<!-- MENU -->
<div class="menu" id="menu">
<div class="close" onclick="closeMenu()">✕</div>

<a href="#">Accueil</a>
<a href="#services">Services</a>
<a href="#projects">Projets</a>
<a href="#contact">Contact</a>

</div>

<!-- HERO -->
<section class="hero">
<div class="hero-content">
<h1>SMERAV</h1>
<p>Notre expertise, votre réussite</p>
</div>
</section>

<!-- SERVICES -->
<section id="services">
<h2>Nos Services</h2>

<div class="services">

<div class="card">
<h3>Réseaux d'eau potable</h3>
<p>Installation et maintenance</p>
</div>

<div class="card">
<h3>Assainissement</h3>
<p>Travaux complets</p>
</div>

<div class="card">
<h3>Génie civil</h3>
<p>Travaux professionnels</p>
</div>

</div>
</section>

<!-- CONTACT -->
<section id="contact">
<h2>Contact</h2>
<p>Fès, Maroc</p>
<p>+212 661 80 88 94</p>
</section>

<script>

function openMenu(){
document.getElementById("menu").classList.add("active");
}

function closeMenu(){
document.getElementById("menu").classList.remove("active");
}

</script>

</body>
</html>
