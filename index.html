<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SMERAV</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}

/* ===== LOADER ===== */
#loader{
position:fixed;
top:0;left:0;
width:100%;height:100%;
background:#000814;
display:flex;
justify-content:center;
align-items:center;
z-index:9999;
transition:0.8s;
}
#loader.hide{opacity:0;visibility:hidden}

.spinner{
width:50px;height:50px;
border:4px solid rgba(255,255,255,0.2);
border-top:4px solid white;
border-radius:50%;
animation:spin 1s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* ===== BACKGROUND ===== */
body{
background:linear-gradient(135deg,#0a1f44,#08142c,#000814);
overflow-x:hidden;
}

/* ===== iPHONE MENU ===== */
.menu{
background:rgba(0,0,0,0.6);
backdrop-filter:blur(15px);
transform:scale(0.9);
opacity:0;
transition:0.35s;
}
.menu.active{
transform:scale(1);
opacity:1;
}

/* stagger */
.menu a{
opacity:0;
transform:translateX(30px);
transition:0.3s;
}
.menu.active a{
opacity:1;
transform:translateX(0);
}
.menu.active a:nth-of-type(1){transition-delay:0.1s;}
.menu.active a:nth-of-type(2){transition-delay:0.2s;}
.menu.active a:nth-of-type(3){transition-delay:0.3s;}
.menu.active a:nth-of-type(4){transition-delay:0.4s;}
.menu.active a:nth-of-type(5){transition-delay:0.5s;}

/* hover */
.menu a:hover{
color:gold;
transform:translateX(6px);
}

/* overlay blur */
.overlay{
backdrop-filter:blur(8px);
}
.overlay.active{
background:rgba(0,0,0,0.6);
}

/* ===== HERO ANIMATION ===== */
.hero-text h1{
opacity:0;
transform:translateY(40px);
animation:fadeUp 1s forwards 0.5s;
}
.hero-text p{
opacity:0;
transform:translateY(40px);
animation:fadeUp 1s forwards 1s;
}
@keyframes fadeUp{
to{opacity:1;transform:translateY(0);}
}

/* ===== CURSOR ===== */
#cursor{
position:fixed;
width:120px;height:120px;
background:radial-gradient(circle,rgba(0,150,255,0.4),transparent);
border-radius:50%;
pointer-events:none;
transform:translate(-50%,-50%);
z-index:9999;
}

/* ===== SCROLL ===== */
.section{
opacity:0;
transform:translateY(50px);
transition:1s;
}
.section.show{
opacity:1;
transform:translateY(0);
}

/* ===== ORIGINAL ===== */
.nav{
position:fixed;top:0;width:100%;
display:flex;justify-content:space-between;
align-items:center;padding:12px 20px;
background:rgba(0,0,0,0.5);
z-index:999;
}
.logo{height:50px}

.menu-btn{
font-size:28px;color:white;
background:rgba(0,0,0,0.5);
padding:8px;border-radius:8px;
cursor:pointer;
}

.overlay{
position:fixed;top:0;left:0;width:100%;height:100%;
opacity:0;visibility:hidden;
}
.overlay.active{opacity:1;visibility:visible}

.menu{
position:fixed;top:0;right:-280px;
width:260px;height:100%;
display:flex;flex-direction:column;
padding:30px;
}
.menu.active{right:0}

.menu a{color:white;margin:10px 0;text-decoration:none}

.hero{
height:100vh;
background:url("local.png?v=6") center/cover no-repeat;
display:flex;align-items:center;justify-content:center;
color:white;text-align:center;
}

.section{padding:70px 20px;text-align:center}

.service{background:white;margin:10px auto;padding:15px;border-radius:12px;width:90%;max-width:400px}

.gallery{display:none}
.gallery.active{display:grid}

input,textarea{width:90%;margin:10px;padding:12px;background:#eee;border:none;border-radius:10px}

button{background:gold;padding:12px;border:none;border-radius:10px}

.map-box{height:350px}
.map-box iframe{width:100%;height:100%}

.whatsapp{
position:fixed;bottom:20px;right:20px;
background:#25D366;color:white;
padding:15px;border-radius:50%;
}
</style>
</head>

<body>

<!-- LOADER -->
<div id="loader"><div class="spinner"></div></div>

<!-- CURSOR -->
<div id="cursor"></div>

<!-- NAV -->
<div class="nav">
<img src="logo-transparent.png" class="logo">
<div class="menu-btn" onclick="toggleMenu()">☰</div>
</div>

<div class="overlay" id="overlay" onclick="closeMenu()"></div>

<div class="menu" id="menu">
<a href="#services">Services</a>
<a href="#offre">Offre</a>
<a href="#projects">Projets</a>
<a href="#contact">Contact</a>
</div>

<section class="hero">
<div class="hero-text">
<h1>SMERAV</h1>
<p>Notre expertise, votre réussite</p>
</div>
</section>

<section class="section" id="services">
<h2>Nos Services</h2>
<div class="service">Réseaux d'eau potable</div>
<div class="service">Assainissement</div>
</section>

<section class="section" id="contact">
<h2>Contact</h2>
<input placeholder="Nom">
<button>Envoyer</button>
</section>

<section class="section">
<div class="map-box">
<iframe src="https://www.google.com/maps?q=Fes,Morocco&output=embed"></iframe>
</div>
</section>

<a class="whatsapp" href="#">💬</a>

<script>

/* LOADER */
window.onload=()=>loader.classList.add("hide")

/* MENU */
function toggleMenu(){
menu.classList.toggle("active")
overlay.classList.toggle("active")
}
function closeMenu(){
menu.classList.remove("active")
overlay.classList.remove("active")
}

/* CURSOR */
document.addEventListener("mousemove",(e)=>{
cursor.style.left=e.clientX+"px"
cursor.style.top=e.clientY+"px"
})

/* SCROLL */
const sections=document.querySelectorAll(".section")
window.addEventListener("scroll",()=>{
sections.forEach(s=>{
if(s.getBoundingClientRect().top<window.innerHeight-80){
s.classList.add("show")
}
})
})

</script>

</body>
</html>
